name: ContaExpress encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_GPG_RECIPIENT: ${{ secrets.BACKUP_GPG_RECIPIENT }}
      BACKUP_REMOTE: ${{ secrets.BACKUP_REMOTE }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
      BACKUP_DIR: ${{ runner.temp }}/contaexpress-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gnupg rclone
      - name: Configure encryption and remote storage
        env:
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gnupg" "$HOME/.config/rclone"
          chmod 700 "$HOME/.gnupg" "$HOME/.config/rclone"
          test -n "$DATABASE_URL"
          test -n "$BACKUP_GPG_RECIPIENT"
          test -n "$BACKUP_REMOTE"
          test -n "$BACKUP_GPG_PUBLIC_KEY"
          test -n "$RCLONE_CONFIG_BASE64"
          printf '%s' "$BACKUP_GPG_PUBLIC_KEY" | gpg --batch --import
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          gpg --list-keys "$BACKUP_GPG_RECIPIENT"
      - name: Create encrypted backup, upload and apply retention
        run: |
          set -euo pipefail
          bash scripts/db-backup.sh
          test -n "$(find "$BACKUP_DIR" -maxdepth 1 -name 'contaexpress-*.dump.gpg' -print -quit)"
      - name: Remove local backup material
        if: always()
        run: rm -rf "$BACKUP_DIR"
