name: ContaExpress CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          SESSION_SECRET: ci-only-test-secret-which-is-long-enough
