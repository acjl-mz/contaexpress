name: ContaExpress CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SESSION_SECRET: ci-only-test-secret-which-is-long-enough
      ADMIN_EMAIL: admin@example.test
      ADMIN_NAME: CI Test Administrator
      ADMIN_PASSWORD: CI-only-password-long-enough-123
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply database migrations
        run: |
          set -euo pipefail
          for migration in \
            database/migrations/001_core_schema.sql \
            database/migrations/002_auth.sql \
            database/migrations/003_posting_controls.sql \
            database/migrations/004_entity_access.sql \
            database/migrations/005_reversal_controls.sql \
            database/migrations/006_login_rate_limit.sql \
            database/migrations/007_accounting_documents.sql \
            database/migrations/008_accounting_tasks.sql \
            database/migrations/009_monthly_close.sql \
            database/migrations/010_password_reset.sql \
            database/migrations/011_treasury_tax.sql \
            database/migrations/012_treasury_accounting_integration.sql
          do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify administrator bootstrap
        run: npm run bootstrap:admin
      - name: Complete test suite (unit + PostgreSQL integration)
        run: npm run test:all
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: HTTP smoke tests
        run: node tests/http-smoke.mjs
      - name: Database backup and restore drill
        run: |
          set -euo pipefail
          export PGUSER=ci PGPASSWORD=ci PGHOST=127.0.0.1 PGPORT=5432
          export BACKUP_DIR="$RUNNER_TEMP/contaexpress-backup"
          bash scripts/db-backup.sh
          backup_file="$(find "$BACKUP_DIR" -maxdepth 1 -name "contaexpress-*.dump" -print -quit)"
          test -n "$backup_file"
          createdb -h 127.0.0.1 -U ci -w contaexpress_restore_ci
          export RESTORE_DATABASE_URL="postgresql://ci:ci@127.0.0.1:5432/contaexpress_restore_ci"
          RESTORE_CONFIRM=YES_RESTORE_DATABASE bash scripts/db-restore.sh "$backup_file"
          bash scripts/db-verify.sh
          dropdb -h 127.0.0.1 -U ci -w contaexpress_restore_ci
