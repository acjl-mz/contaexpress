services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contaexpress
      POSTGRES_USER: contaexpress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - contaexpress_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contaexpress -d contaexpress"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  contaexpress_pgdata:
